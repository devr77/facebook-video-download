<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#1a5ce6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
{{twitterSite}}

<link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base}}/assets/img/apple-touch-icon.png">
<link rel="manifest" href="{{base}}/site.webmanifest">
<link rel="preconnect" href="{{apiOrigin}}" crossorigin>
<link rel="stylesheet" href="{{base}}/assets/css/style.css?v={{cssHash}}">
<script type="module" src="{{base}}/assets/js/main.js?v={{jsHash}}"></script>
{{analytics}}
{{schema}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
</body>
</html>
